server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    # SPA React (react-router): cualquier ruta desconocida sirve index.html, que nunca se cachea
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Recursos con hash generados por Vite: caché larga e inmutable
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy para evitar CORS en despliegue integrado.
    # Se resuelve "middleware" en cada petición (DNS de Docker) para tolerar que el contenedor se recree
    # con otra IP (p. ej. `docker compose up -d --build middleware`) sin reiniciar el frontend.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://middleware:8000;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
