networks:
  moodle-net:
    driver: bridge

volumes:
  moodle_data:
    driver: local
  moodle_db_data:
    driver: local
  analytics_pgdata:
    driver: local
  sqlserver_data:
    driver: local
  ollama_data:
    driver: local

services:
  # ----------------------------------------------------------------------------
  # 1. MOODLE LMS & MOODLE DATABASE
  # ----------------------------------------------------------------------------
  moodle-db:
    image: mariadb:10.11
    container_name: moodle_mariadb
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=moodle_root_secret
      - MARIADB_USER=bn_moodle
      - MARIADB_PASSWORD=moodle_db_pass_2026
      - MARIADB_DATABASE=bitnami_moodle
      - MARIADB_CHARACTER_SET=utf8mb4
      - MARIADB_COLLATE=utf8mb4_unicode_ci
    volumes:
      # La imagen oficial mariadb guarda los datos en /var/lib/mysql (antes se montaba /bitnami/mariadb y
      # los datos quedaban en volúmenes anónimos que se perdían al recrear el contenedor)
      - moodle_db_data:/var/lib/mysql
    networks:
      - moodle-net
  moodle:
    image: bitnamilegacy/moodle:4.3.2
    container_name: moodle_lms
    restart: unless-stopped
    ports:
      - "${MOODLE_PORT:-8080}:8080"
    environment:
      - MOODLE_DATABASE_HOST=moodle-db
      - MOODLE_DATABASE_PORT_NUMBER=3306
      - MOODLE_DATABASE_USER=bn_moodle
      - MOODLE_DATABASE_PASSWORD=moodle_db_pass_2026
      - MOODLE_DATABASE_NAME=bitnami_moodle
      - MOODLE_USERNAME=admin
      - MOODLE_PASSWORD=MoodleAdmin2026!
      - MOODLE_EMAIL=admin@uta.edu.ec
      - MOODLE_SITE_NAME=Moodle UTA
      - MOODLE_LANG=es
      - MOODLE_ENABLE_ENROL_WEBSERVICE=yes
      # Token que seed.php registra para el servicio EduMonitor_WS (debe coincidir con el middleware)
      - MOODLE_TOKEN=${MOODLE_TOKEN:-edumonitorutadevtoken2026fisei01}
    # Siembra automática: envuelve el entrypoint de Bitnami y ejecuta seed.php al quedar listo
    entrypoint: ["/bin/bash", "/opt/edumonitor_seed/entrypoint-seed.sh"]
    command: []
    volumes:
      - moodle_data:/bitnami/moodle
      - ./docker/moodle:/opt/edumonitor_seed:ro
    depends_on:
      - moodle-db
    networks:
      - moodle-net
  # ----------------------------------------------------------------------------
  # 2. BASE DE DATOS ANALÍTICA (PostgreSQL - Principal para Analítica y HU-01)
  # ----------------------------------------------------------------------------
  analytics-db:
    image: postgres:15-alpine
    container_name: moodle_analytics_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${DB_NAME:-moodle_analytics}
      - POSTGRES_USER=${DB_USER:-analytics_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?Defina DB_PASSWORD en .env}
    volumes:
      - analytics_pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - moodle-net

  # ----------------------------------------------------------------------------
  # 2.B CONTENEDOR SQL SERVER (Opcional / Integración Corporativa)
  # ----------------------------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: moodle_sqlserver
    restart: unless-stopped
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Developer
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - moodle-net
  # ----------------------------------------------------------------------------
  # 3. MIDDLEWARE (FastAPI / Python 3.11+)
  # ----------------------------------------------------------------------------
  middleware:
    build:
      context: ./middleware
      dockerfile: Dockerfile
    container_name: moodle_middleware
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      # Credenciales sólo desde .env (Sprint 3): sin valores por defecto para secretos
      - DATABASE_URL=postgresql://${DB_USER:-analytics_user}:${DB_PASSWORD:?Defina DB_PASSWORD en .env}@analytics-db:5432/${DB_NAME:-moodle_analytics}
      - JWT_SECRET=${JWT_SECRET:?Defina JWT_SECRET en .env}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - SEED_DOCENTE_PASSWORD=${SEED_DOCENTE_PASSWORD:?Defina SEED_DOCENTE_PASSWORD en .env}
      - SEED_ESTUDIANTE_PASSWORD=${SEED_ESTUDIANTE_PASSWORD:-}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-}
      - MOODLE_URL=${MOODLE_URL:-http://moodle:8080}
      - MOODLE_HOST_HEADER=${MOODLE_HOST_HEADER:-localhost}
      - MOODLE_TOKEN=${MOODLE_TOKEN:-edumonitorutadevtoken2026fisei01}
      - MOODLE_WS_TOKEN=${MOODLE_TOKEN:-edumonitorutadevtoken2026fisei01}
      - AGENT_URL=${AGENT_URL:-http://agent:8001}
      - AGENT_SERVICE_TOKEN=${AGENT_SERVICE_TOKEN:-agent_secret_token_uta_2026}
      - OLLAMA_HOST=http://ollama:11434
      - MSSQL_HOST=sqlserver
      - MSSQL_PORT=1433
      - MSSQL_DB=MoodleUTADB
      - MSSQL_USER=sa
      - MSSQL_PASSWORD=${MSSQL_PASSWORD:-}
    depends_on:
      analytics-db:
        condition: service_healthy
      moodle:
        condition: service_started
      agent:
        condition: service_started
    networks:
      - moodle-net
  # ----------------------------------------------------------------------------
  # 4. AGENTE IA (Ollama SLM Local - Inferencia CPU/RAM sin GPU)
  # ----------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: moodle_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=2
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - moodle-net

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: moodle_agent_service
    restart: unless-stopped
    ports:
      - "8001:8001"
      - "8100:8001"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:1b
      - AGENT_INFERENCE_TIMEOUT_SECONDS=10
      - AGENT_SERVICE_TOKEN=${AGENT_SERVICE_TOKEN:-agent_secret_token_uta_2026}
    depends_on:
      - ollama
    networks:
      - moodle-net
  # ----------------------------------------------------------------------------
  # 5. FRONTEND MINIMALISTA (Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: moodle_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - middleware
    networks:
      - moodle-net