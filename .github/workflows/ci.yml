name: CI - Integración Continua (FISEI UTA)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # ----------------------------------------------------------------------------
  # 1. ANÁLISIS ESTÁTICO DE CÓDIGO (LINTERS & FORMATEO)
  # Responsable Scrum: Alan Zamora (Calidad & CI)
  # ----------------------------------------------------------------------------
  lint:
    name: Lint & Estilo de Código
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar herramientas de calidad (Ruff, Flake8)
        run: |
          python -m pip install --upgrade pip
          pip install ruff flake8

      - name: Ejecutar Ruff Linter
        run: |
          ruff check middleware/ agent/ scripts/ --select=E9,F63,F7,F82 --show-source

      - name: Auditoría de sintaxis con Flake8
        run: |
          flake8 middleware/ agent/ scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics

  # ----------------------------------------------------------------------------
  # 2. PRUEBAS AUTOMATIZADAS (PYTEST & CRITERIOS DE HU-01)
  # ----------------------------------------------------------------------------
  test:
    name: Pruebas Automáticas y Verificación HU-01
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias del Middleware y Agente
        run: |
          python -m pip install --upgrade pip
          pip install -r middleware/requirements.txt
          pip install -r agent/requirements.txt

      - name: Ejecutar Verificación Formal de HU-01 (Script de Aceptación)
        run: |
          python scripts/verify_hu01.py

      - name: Ejecutar Pruebas Unitarias del Middleware (Cálculo Ponderado, ID Parser, Endpoints)
        run: |
          pytest middleware/tests/ -v --tb=short

      - name: Ejecutar Pruebas del Agente y Motor Heurístico (HU-11B)
        run: |
          pytest agent/tests/ -v --tb=short

  # ----------------------------------------------------------------------------
  # 3. VALIDACIÓN DE ENTORNO DOCKER (DOCKER COMPOSE CONFIG)
  # ----------------------------------------------------------------------------
  docker-validation:
    name: Validación de Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Copiar variables de entorno de ejemplo
        run: cp .env.example .env

      - name: Validar sintaxis y configuración de docker-compose.yml
        run: |
          docker compose config --quiet
          echo "docker-compose.yml validado exitosamente."
